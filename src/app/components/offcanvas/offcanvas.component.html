@if(visible) {
<div
  class="fixed top-0 offcanvas-panel bottom-0 right-0 w-[300px] z-40 bg-black bg-opacity-50 transition-opacity duration-300"
>
  <div
    class="offcanvas-panel fixed right-0 top-0 h-full w-80 bg-white shadow-lg transition-transform duration-300"
  >
    <button class="absolute top-4 right-4" (click)="close()">✕</button>
    <div class="p-4">
      <!-- Your offcanvas content -->
      <h2 class="text-lg font-bold">Cart</h2>
      <div class="">
        @for (item of cartItems(); track item) {
        <div class="mb-2 relative">
          <div class="flex flex-row gap-4">
            <div class="w-[150px]">
              <img
                class="object-cover h-[100px] w-full rounded-md"
                src="{{ item.product.images[0] }}"
                alt=""
              />
            </div>
            <div class="flex flex-col-reverse justify-between gap-2">
              <div class="flex flex-row gap-2">
                <span>Numbers: </span>
                <input
                  title="inputNumber"
                  type="number"
                  class="w-[40px] text-teal-700 font-bold"
                  value="{{ item.quantity }}"
                />
              </div>
              <div class="font-bold">{{ item.product.title }}</div>
            </div>
          </div>

          <div
            class="absolute text-red-600 right-0 font-bold px-2 py-1 rounded-2xl bg-gray-300 top-0 cursor-pointer"
            (click)="removeFromCart(item)"
          >
            X
          </div>
        </div>

        }
      </div>
    </div>
  </div>
</div>
}
